{% extends 'learning_log/base.html' %}

{% block content %}

<p> Topics </p>

<ul>
    {% for topic in topics %}
        <li>
            <a href="{% url 'learning_log:topic' topic.id %}">{{topic.text}}</a>
        </li>
    {% empty %}
        <li> There are no topics yet </li>
    {% endfor %}
</ul>

{% endblock content %}
