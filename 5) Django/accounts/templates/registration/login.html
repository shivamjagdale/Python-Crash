{% extends 'learning_log/base.html' %}

{% block content %}

    {% if form.errors %}
        <p> Your username and password did not match</p>
    {% endif %}

    <form action="{% url 'accounts:login' %}" method="post">
        {% csrf_token %}
        {{form.as_div}}
        <button name="submit">Login</button>
    </form>

{% endblock content %}
